name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          for file in src/*.js test/*.js web/app.js; do
            node --check "$file"
          done
      - name: Unit tests
        run: node --test test/unit.test.js

  docker:
    name: Docker build + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: stream-vod-guard:ci
          build-args: APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests in image
        run: docker run --rm --entrypoint node stream-vod-guard:ci --test test/unit.test.js
      - name: Capture, audit and integration tests
        run: |
          docker run --rm -e E2E=1 --entrypoint node stream-vod-guard:ci \
            --test test/audit.test.js test/e2e.test.js test/integration.test.js
      - name: Validate Compose file
        run: |
          cp .env.example .env
          mkdir -p videos/recordings data
          docker compose config >/dev/null
          echo "docker compose config OK"
