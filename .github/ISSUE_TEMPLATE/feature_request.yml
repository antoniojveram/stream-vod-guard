name: Feature request
description: Suggest an improvement for Stream VOD Guard
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture / recording
        - Twitch monitor
        - YouTube monitor
        - Dashboard / settings
        - Storage / archive
        - Mute audit
        - CLI / API
        - Documentation
        - Other
