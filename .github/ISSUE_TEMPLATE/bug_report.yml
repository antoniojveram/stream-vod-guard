name: Bug report
description: Report a reproducible problem with Stream VOD Guard
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include tokens, cookies or private recordings.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Start ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / image tag
      placeholder: v1.0.0 or ghcr.io/...:latest
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs --tail=200 stream-vod-guard`. Remove secrets.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Docker version, NAS/local disk, Twitch/YouTube
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed tokens, cookies and personal data from the logs.
          required: true
